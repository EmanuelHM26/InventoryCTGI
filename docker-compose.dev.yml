services:
  # Base de datos MariaDB
  database:
    image: mariadb:10.4
    container_name: inventoryctgi_db_dev
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: Root
      MYSQL_DATABASE: mydb
    volumes:
      - mariadb_data_dev:/var/lib/mysql
      - ./src/scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - inventoryctgi_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pRoot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Backend (Node.js + Express)
  backend:
    build:
      context: ./src
      dockerfile: Dockerfile
    container_name: inventoryctgi_backend_dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DB_HOST: database
      DB_USER: root
      DB_PASS: Root
      DB_NAME: mydb
      DB_PORT: 3306
      PORT: 3000
      JWT_SECRET: EMND@project_cl@v3_S3cr3t_2025!
      NODE_ENV: development
      EMAIL_USER: emanuelhuertas2604@gmail.com
      EMAIL_PASS: vedr xvqu ftnl ltjo
    depends_on:
      database:
        condition: service_healthy  # ✅ Espera a que la BD esté HEALTHY
    volumes:
      - ./src:/app
      - /app/node_modules
    networks:
      - inventoryctgi_network

  # Frontend (React + Vite)
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args: 
        ENV_FILE: .env.docker
    container_name: inventoryctgi_frontend_dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
      VITE_IS_DOCKER: true
    depends_on:
      backend:
        condition: service_started  # ✅ Espera a que el backend inicie
    volumes:
      - ./client:/app
      - /app/node_modules
    networks:
      - inventoryctgi_network
    stdin_open: true
    tty: true

networks:
  inventoryctgi_network:
    driver: bridge

volumes:
  mariadb_data_dev: